[workspace]

[package]
name = "sekonic-bridge"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sekonic-schema = { path = "../../../crates/sekonic-schema" }
sekonic-transport = { path = "../../../crates/sekonic-transport" }
sekonic-proto-omr = { path = "../../../crates/sekonic-proto-omr" }
sekonic-proto-cis = { path = "../../../crates/sekonic-proto-cis" }
sekonic-grader = { path = "../../../crates/sekonic-grader" }
sekonic-sim = { path = "../../../crates/sekonic-sim" }
sekonic-sync = { path = "../../../crates/sekonic-sync" }
