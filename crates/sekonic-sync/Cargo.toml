[package]
name = "sekonic-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sekonic-schema = { path = "../sekonic-schema" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.42", features = ["sync", "time", "macros", "io-util", "rt", "net"] }
tracing.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[dev-dependencies]
sekonic-transport = { path = "../sekonic-transport" }
sekonic-proto-omr = { path = "../sekonic-proto-omr" }
sekonic-grader = { path = "../sekonic-grader" }
sekonic-sim = { path = "../sekonic-sim" }
